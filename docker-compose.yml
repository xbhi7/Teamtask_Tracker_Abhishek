version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: teamtask-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass
      POSTGRES_DB: teamtask_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teamtask_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teamtask-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: teamtask-backend
    ports:
      - "5002:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgres_pass@postgres:5432/teamtask_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "sde2-takehome-teamtask-access-secret-key-1298471"
      JWT_ACCESS_EXPIRATION: "15m"
      JWT_REFRESH_SECRET: "sde2-takehome-teamtask-refresh-secret-key-1298471"
      JWT_REFRESH_EXPIRATION: "7d"
      NODE_ENV: "development"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npx prisma db push && npm run db:seed && npm run dev"

  frontend:
    build: ./frontend
    container_name: teamtask-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5002/api
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
